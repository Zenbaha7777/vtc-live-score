name: init-store
on: workflow_dispatch
jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - name: Create and test JSONBlob
        run: |
          H=$(curl -s -i -X POST https://jsonblob.com/api/jsonBlob -H "Content-Type: application/json" -H "Accept: application/json" -d '{"logs":[],"resetAt":0}')
          echo "$H" | head -20
          LOC=$(echo "$H" | grep -i '^location:' | tr -d '\r' | awk '{print $2}')
          ID=${LOC##*/}
          echo "BLOB_ID=$ID"
          echo "--- CORS preflight PUT"
          curl -s -i -X OPTIONS "https://jsonblob.com/api/jsonBlob/$ID" -H "Origin: https://zenbaha7777.github.io" -H "Access-Control-Request-Method: PUT" -H "Access-Control-Request-Headers: content-type" | head -20
          echo "--- PUT"
          curl -s -i -X PUT "https://jsonblob.com/api/jsonBlob/$ID" -H "Origin: https://zenbaha7777.github.io" -H "Content-Type: application/json" -H "Accept: application/json" -d '{"logs":[],"resetAt":0}' | head -15
          echo "--- GET"
          curl -s -i "https://jsonblob.com/api/jsonBlob/$ID" -H "Origin: https://zenbaha7777.github.io" -H "Accept: application/json" | head -15
