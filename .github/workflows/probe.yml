name: probe-stores
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          T="vtc-probe$RANDOM$RANDOM$RANDOM"
          curl -s -X POST "https://ntfy.sh/$T" -d '{"k":"a","id":"x1"}' >/dev/null
          curl -s -X POST "https://ntfy.sh/$T" -d '{"k":"a","id":"x2"}' >/dev/null
          sleep 5
          echo "=== poll"; curl -s "https://ntfy.sh/$T/json?poll=1&since=all"
          echo "=== sse"; timeout 4 curl -s -N "https://ntfy.sh/$T/sse?since=all" -H "Origin: https://zenbaha7777.github.io" -D - | head -20
